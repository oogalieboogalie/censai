name: Weekly public release

on:
  schedule:
    - cron: "0 10 * * 0"
  workflow_dispatch:

concurrency:
  group: weekly-public-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Verify release candidate
        run: |
          npm ci
          npm run check
          node scripts/security-tripwires.mjs

      - name: Publish dated release when main changed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="weekly-$(date -u +%Y-%m-%d)"
          latest="$(git tag --list 'weekly-*' --sort=-version:refname | head -n 1)"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "$tag already exists."
            exit 0
          fi
          if [ -n "$latest" ] && [ "$(git rev-list --count "$latest"..HEAD)" -eq 0 ]; then
            echo "No commits have landed since $latest."
            exit 0
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "Censai weekly release ${tag#weekly-}"
